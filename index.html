<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Siply – Curated Cocktails</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <script src="shared/tailwind-config.js"></script>
    <link rel="stylesheet" href="shared/styles.css" />
  <link rel="stylesheet" href="features/discovery.css" />
  <link rel="stylesheet" href="features/surprise.css" />
  <link rel="stylesheet" href="features/siplog.css" />
  <link rel="stylesheet" href="features/community.css" />
  <link rel="stylesheet" href="features/profile.css" />
  <link rel="stylesheet" href="features/bar.css" />
</head>
<body>
  <!-- PHONE FRAME -->
  <div class="phone-shell">
    <div class="phone-notch"></div>
    <div class="phone-screen">
      <div class="phone-status">
        <span id="status-time">9:41</span>
        <span class="status-icons">
          <svg width="16" height="11" viewBox="0 0 16 11" fill="none"><path d="M1 4l2-2 2 2M5 6l3-3 3 3M9 8l2-2 2 2" stroke="#141414" stroke-width="1.2" stroke-linecap="round"/></svg>
          <svg width="14" height="10" viewBox="0 0 14 10" fill="#141414"><path d="M7 0C4.5 0 2.2 1 .4 2.6l1 1.1C2.9 2.3 4.9 1.5 7 1.5s4.1.8 5.6 2.2l1-1.1C11.8 1 9.5 0 7 0zM7 3c-1.7 0-3.3.6-4.6 1.7l1 1.1C4.4 5 5.7 4.5 7 4.5s2.6.5 3.6 1.3l1-1.1C10.3 3.6 8.7 3 7 3zM7 6c-.9 0-1.7.3-2.4.9l1 1.1C6.1 7.6 6.5 7.5 7 7.5s.9.1 1.4.5l1-1.1C8.7 6.3 7.9 6 7 6z"/></svg>
          <svg width="24" height="11" viewBox="0 0 24 11" fill="none"><rect x="1" y="1" width="20" height="9" rx="2.5" stroke="#141414" stroke-width="1" opacity="0.4"/><rect x="3" y="3" width="14" height="5" rx="1" fill="#141414"/><rect x="22" y="4" width="1.5" height="3" rx="0.5" fill="#141414" opacity="0.4"/></svg>
        </span>
      </div>

  <div id="app-frame">
    <!-- LOGIN GATE -->
    <div id="screen-login" class="screen active">
      <div class="screen-scroll hide-scrollbar flex-1 flex flex-col px-7 pt-8">
        <div class="text-center mb-12">
          <div class="login-crest" aria-hidden="true"><svg width="36" height="42" viewBox="0 0 40 48" fill="none"><path d="M4 9H36L20 28L4 9ZM20 28V42M11 43H29M27 12L34 2" stroke="currentColor" stroke-width="1.2"/><circle cx="30" cy="9" r="4" fill="#261B15" stroke="currentColor"/></svg></div>
          <h1 class="font-serif text-5xl italic text-dark mb-4">Siply</h1>
          <p class="text-sm text-gray-500 tracking-wide">A curated cocktail experience for every mood.</p>
        </div>
        <div class="flex-1 space-y-4">
          <button onclick="startUserLogin()" class="pressable w-full btn-primary text-center text-sm uppercase tracking-widest">User Log In</button>
          <button onclick="startBarLogin()" class="pressable w-full btn-outline text-center text-sm uppercase tracking-widest">Bar Log In</button>
        </div>
        <p class="text-center text-[11px] text-gray-400 pb-6">Demo prototype</p>
      </div>
    </div>

    <!-- USER LOGIN FORM -->
    <div id="screen-login-form" class="screen">
      <div class="screen-scroll hide-scrollbar flex-1 flex flex-col px-6 pt-4">
        <button onclick="go('login')" class="w-9 h-9 rounded-full bg-white border border-sand flex items-center justify-center mb-6 pressable"><i data-lucide="arrow-left" class="w-4 h-4"></i></button>
        <p id="login-role-label" class="eyebrow mb-2">User Access</p>
        <h2 class="font-serif text-2xl mb-6">Welcome back</h2>
        <label class="text-xs font-medium text-gray-500 uppercase tracking-wider mb-2 block">Email or Phone</label>
        <input id="login-email" type="text" class="w-full rounded-2xl border border-sand bg-white px-4 py-3.5 mb-4 outline-none focus:border-gold" placeholder="name@email.com" />
        <label class="text-xs font-medium text-gray-500 uppercase tracking-wider mb-2 block">Password</label>
        <input id="login-pass" type="password" class="w-full rounded-2xl border border-sand bg-white px-4 py-3.5 mb-6 outline-none focus:border-gold" placeholder="••••••••" />
        <button onclick="toOtp()" class="pressable w-full btn-primary text-sm uppercase tracking-widest">Continue</button>
      </div>
    </div>

    <!-- OTP -->
    <div id="screen-otp" class="screen">
      <div class="screen-scroll hide-scrollbar flex-1 flex flex-col px-6 pt-8">
        <div class="text-center mb-8">
          <p class="eyebrow mb-3">Verification</p>
          <h2 class="font-serif text-2xl mb-2">Enter the code</h2>
          <p class="text-sm text-gray-500">We sent a 6-digit code to your device.</p>
        </div>
        <div class="flex justify-center gap-2 mb-8" id="otp-boxes">
          <div class="w-10 h-12 rounded-xl border border-sand bg-white flex items-center justify-center text-base font-medium">-</div>
          <div class="w-10 h-12 rounded-xl border border-sand bg-white flex items-center justify-center text-base font-medium">-</div>
          <div class="w-10 h-12 rounded-xl border border-sand bg-white flex items-center justify-center text-base font-medium">-</div>
          <div class="w-10 h-12 rounded-xl border border-sand bg-white flex items-center justify-center text-base font-medium">-</div>
          <div class="w-10 h-12 rounded-xl border border-sand bg-white flex items-center justify-center text-base font-medium">-</div>
          <div class="w-10 h-12 rounded-xl border border-sand bg-white flex items-center justify-center text-base font-medium">-</div>
        </div>
        <button id="otp-confirm" onclick="confirmOtp()" class="pressable w-full btn-primary text-sm uppercase tracking-widest opacity-50" disabled>Confirm</button>
      </div>
    </div>

    <!-- MAIN APP -->
    <div id="main-app" class="hidden flex flex-col h-full">
      <header class="flex-shrink-0 z-30 bg-cream/90 backdrop-blur px-5 py-3 flex items-center justify-between">
        <div class="font-serif text-xl italic text-dark">Siply</div>
        <button id="header-profile" onclick="go('profile')" class="pressable w-9 h-9 rounded-full bg-white border border-sand flex items-center justify-center overflow-hidden relative">
          <i data-lucide="user" class="w-4 h-4 text-dark"></i>
        </button>
      </header>

      <div class="screen-scroll hide-scrollbar flex-1 relative">
        <div class="px-5 pb-6">
        <!-- AI DISCOVERY -->
        <div id="mount-discovery"></div>

        <!-- SURPRISE ME -->
        <div id="mount-surprise"></div>

        <!-- SIP LOG -->
        <div id="mount-siplog"></div>

        <!-- COMMUNITY -->
        <div id="mount-community"></div>

        <!-- PROFILE -->
        <div id="mount-profile"></div>

        <!-- BAR DASHBOARD -->
        <div id="mount-bar"></div>
        </div>
      </div>

      <!-- Bottom nav -->
      <nav class="flex-shrink-0 bg-white/95 backdrop-blur border-t border-sand/60 px-2 py-2 flex justify-between items-center z-40">
        <button id="nav-discovery" onclick="go('discovery')" data-nav="discovery" class="nav-item active flex flex-col items-center gap-0.5 py-1 flex-1 pressable">
          <i data-lucide="sparkles" class="w-5 h-5"></i>
          <span class="text-[9px] tracking-wide">AI Discovery</span>
        </button>
        <button id="nav-surprise" onclick="go('surprise')" data-nav="surprise" class="nav-item flex flex-col items-center gap-0.5 py-1 flex-1 pressable">
          <i data-lucide="dices" class="w-5 h-5"></i>
          <span class="text-[9px] tracking-wide">Surprise Me</span>
        </button>
        <button id="nav-siplog" onclick="go('siplog')" data-nav="siplog" class="nav-item flex flex-col items-center gap-0.5 py-1 flex-1 pressable">
          <i data-lucide="calendar-heart" class="w-5 h-5"></i>
          <span class="text-[9px] tracking-wide">Sip Log</span>
        </button>
        <button id="nav-community" onclick="go('community')" data-nav="community" class="nav-item flex flex-col items-center gap-0.5 py-1 flex-1 pressable">
          <i data-lucide="users" class="w-5 h-5"></i>
          <span class="text-[9px] tracking-wide">Community</span>
        </button>
        <button id="nav-bar-dashboard" onclick="go('bar-dashboard')" data-nav="bar-dashboard" class="nav-item hidden flex flex-col items-center gap-0.5 py-1 flex-1 pressable">
          <i data-lucide="store" class="w-5 h-5"></i>
          <span class="text-[9px] tracking-wide">Dashboard</span>
        </button>
      </nav>
    </div>

    <!-- OVERLAYS (absolute inside phone screen) -->
    <div id="overlay-root" class="absolute inset-0 z-[60] pointer-events-none"></div>

    <!-- DAY DETAIL / DRINK CAROUSEL MODAL -->
    <div id="modal-root" class="absolute inset-0 z-[55] hidden flex items-end">
      <div class="absolute inset-0 bg-black/40" onclick="closeModal()"></div>
      <div class="relative bg-cream rounded-t-[32px] w-full max-h-[75%] overflow-y-auto hide-scrollbar p-5 pb-8 animate-[slideUp_.3s_ease]">
        <button onclick="closeModal()" class="absolute top-3 right-3 w-8 h-8 rounded-full bg-white border border-sand flex items-center justify-center pressable"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
        <div id="modal-body"></div>
      </div>
    </div>

<div id="mount-community-modal"></div>
    <!-- QR OVERLAY -->
    <div id="qr-overlay" class="absolute inset-0 z-[70] hidden items-center justify-center p-6">
      <div class="bg-cream rounded-[24px] p-5 w-full max-w-[280px] text-center">
        <h3 id="qr-title" class="font-serif text-lg mb-1"></h3>
        <p class="text-xs text-gray-400 mb-4">Show this at the bar</p>
        <div class="card-dark p-4 rounded-2xl mb-4 relative sheen overflow-hidden">
          <div id="qr-slot" class="qr-gold flex justify-center"></div>
          <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#C9A66B" stroke-width="1.2"><path d="M8 21h8M12 21V11m0 0c-2.5 0-4.5-2-4.5-4.5S9.5 2 12 2s4.5 2 4.5 4.5S14.5 11 12 11Z"/></svg>
          </div>
        </div>
        <button onclick="closeQrOverlay()" class="pressable w-full btn-primary text-sm uppercase tracking-widest">Close</button>
      </div>
    </div>

    <!-- TOAST -->
    <div id="toast" class="absolute top-12 left-1/2 -translate-x-1/2 bg-dark text-white text-xs px-4 py-2.5 rounded-full shadow-xl opacity-0 pointer-events-none transition-opacity z-[80] tracking-wide whitespace-nowrap"></div>
  </div>
    </div>
  </div>

    <script defer src="shared/data.js"></script>
  <script defer src="shared/app.js"></script>
  <script defer src="features/discovery.js"></script>
  <script defer src="features/surprise.js"></script>
  <script defer src="features/siplog.js"></script>
  <script defer src="features/community.js"></script>
  <script defer src="features/profile.js"></script>
  <script defer src="features/bar.js"></script>
  <script defer src="shared/init.js"></script>
</body>
</html>
